pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}
rootProject.name = 'mmlf'
include 'common', 'coordinator', 'launcher'
if (!providers.gradleProperty('coreOnly').isPresent()) {
    include 'fabric-bridge', 'neoforge-bridge', 'fabric-test-mod', 'neoforge-test-mod'
}
