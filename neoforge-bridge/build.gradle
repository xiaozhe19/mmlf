plugins { id 'net.neoforged.moddev' version '2.0.78' }
def mmlfRoot = rootDir.absolutePath
base { archivesName = 'mmlf-neoforge-bridge' }
sourceSets.main.java.srcDir '../bridge-common/src/main/java'
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.java.srcDir '../coordinator/src/main/java'
sourceSets.main.java.srcDir '../launcher/src/main/java'
evaluationDependsOn(':launcher')
sourceSets.main.resources.srcDir '../bridge-common/src/main/resources'
dependencies {
    implementation project(':common')
    implementation('org.java-websocket:Java-WebSocket:1.6.0') { exclude group: 'org.slf4j', module: 'slf4j-api' }
    jarJar('org.java-websocket:Java-WebSocket:1.6.0') { exclude group: 'org.slf4j', module: 'slf4j-api' }
}
neoForge {
    version = neoforge_version
    runs {
        client {
            client()
            gameDirectory = file(System.getenv('MMLF_GAME_ROOT') ? System.getenv('MMLF_GAME_ROOT') + '/neoforge' : 'run')
            programArguments.addAll '--width', '1280', '--height', '720'
            if (System.getenv('MMLF_SESSION')) systemProperty 'mmlf.session', System.getenv('MMLF_SESSION')
            systemProperty 'mmlf.runtime', 'neoforge'
            systemProperty 'mmlf.root', mmlfRoot
            systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', file('run/natives-neoforge').absolutePath
        }
    }
    mods {
        mmlf_bridge { sourceSet sourceSets.main }
        mmlf_neoforge_test { sourceSet project(':neoforge-test-mod').sourceSets.main }
    }
}
// A client started without a session hosts one; its own third-party mods are staged before it starts.
tasks.register('stageHostMods', JavaExec) {
    onlyIf { !System.getenv('MMLF_SESSION') }
    classpath = project(':launcher').sourceSets.main.runtimeClasspath
    mainClass = 'dev.mmlf.launcher.SessionHost'
    args rootProject.file('mmlf/mods').absolutePath, 'neoforge', file('run/mods').absolutePath
}
tasks.named('runClient') { dependsOn ':neoforge-test-mod:classes', 'stageHostMods' }



dependencies { additionalRuntimeClasspath('org.java-websocket:Java-WebSocket:1.6.0') { exclude group: 'org.slf4j', module: 'slf4j-api' } }

