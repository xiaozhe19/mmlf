allprojects {
    group = 'dev.mmlf'
    version = '1.0.0-demo'
    repositories { mavenCentral() }
}
subprojects {
    apply plugin: 'java-library'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
}

// Release mods for players: one jar per loader, and each loader's test mod, whose blocks the title screen's
// "MMLF 测试平台" places (optional: without them the platform shows only the other mods' blocks).
tasks.register('release', Copy) {
    def fabric = project(':fabric-bridge'), neoforge = project(':neoforge-bridge')
    def fabricTest = project(':fabric-test-mod'), neoforgeTest = project(':neoforge-test-mod')
    dependsOn fabric.tasks.named('remapJar'), neoforge.tasks.named('jar'), fabricTest.tasks.named('remapJar'), neoforgeTest.tasks.named('jar')
    from(fabric.tasks.named('remapJar')) { rename { "mmlf-fabric-${version}.jar" } }
    from(neoforge.tasks.named('jar')) { rename { "mmlf-neoforge-${version}.jar" } }
    from(fabricTest.tasks.named('remapJar')) { rename { "mmlf-fabric-testmod-${version}.jar" } }
    from(neoforgeTest.tasks.named('jar')) { rename { "mmlf-neoforge-testmod-${version}.jar" } }
    into layout.buildDirectory.dir('release')
}
